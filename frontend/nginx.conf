server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # AI Chatbot proxy
    location /api/ai/ask {
        resolver 127.0.0.11 valid=10s;
        set $chatbot_upstream http://chatbot:8000;
        proxy_pass $chatbot_upstream/api/chat;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # API isteklerini Spring Boot backend'e ilet
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }



    # Angular SPA - index.html asla önbelleğe alınmasın
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Statik dosyalar için makul bir önbellek (1 ay)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
